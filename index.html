<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      SEO CONSOLIDATION (P0) — LEGACY DEINDEX + CLIENT REDIRECT.
      This legacy page targeted the same intent ("Los Cabos airport transfers / private
      transportation") as the maintained platform page at
      airport-transfers.privatechefloscabos.com. Two indexable URLs for one intent split
      the ranking signals, so this page is retired from search and sends visitors on.

      This is NOT a real HTTP 301: GitHub Pages serves static HTML and cannot issue a
      server-side redirect for this host. What we do instead is a LEGACY DEINDEX + CLIENT
      REDIRECT:
        - canonical → the airport-transfers page (consolidates ranking signals),
        - <meta robots="noindex, follow"> (drops this URL from the index, passes link equity),
        - an instant <meta http-equiv="refresh"> (client-side redirect for humans),
        - sitemap emptied (nothing advertised here).
      This is enough to remove the SEO competition today.

      FUTURE IDEAL: a real HTTP 301 from this hostname, once it sits behind a layer that can
      issue one (e.g. Cloudflare in front of this domain). Until then, the above is the
      correct interim measure.
    -->
    <title>Private Transportation in Los Cabos — moved</title>
    <link
      rel="canonical"
      href="https://airport-transfers.privatechefloscabos.com/private-transportation-los-cabos/"
    />
    <meta name="robots" content="noindex, follow" />
    <meta
      http-equiv="refresh"
      content="0; url=https://airport-transfers.privatechefloscabos.com/private-transportation-los-cabos/"
    />
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1720;
        color: #e8edf2;
        text-align: center;
        padding: 1.5rem;
      }
      a {
        color: #7cc4ff;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        Private transportation in Los Cabos has a new home. Redirecting you to
        <a
          href="https://airport-transfers.privatechefloscabos.com/private-transportation-los-cabos/"
          >airport-transfers.privatechefloscabos.com</a
        >…
      </p>
    </main>
  </body>
</html>
